name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Build Token Bar
        shell: powershell
        run: .\build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TokenBar-Windows
          path: dist/TokenBar.exe
